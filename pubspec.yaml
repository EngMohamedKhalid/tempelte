name: tempelte
description: "A new Flutter project."
# The following line prevents the package from being accidentally published to
# pub.dev using `flutter pub publish`. This is preferred for private packages.
publish_to: 'none' # Remove this line if you wish to publish to pub.dev

# The following defines the version and build number for your application.
# A version number is three numbers separated by dots, like 1.2.43
# followed by an optional build number separated by a +.
# Both the version and the builder number may be overridden in flutter
# build by specifying --build-name and --build-number, respectively.
# In Android, build-name is used as versionName while build-number used as versionCode.
# Read more about Android versioning at https://developer.android.com/studio/publish/versioning
# In iOS, build-name is used as CFBundleShortVersionString while build-number is used as CFBundleVersion.
# Read more about iOS versioning at
# https://developer.apple.com/library/archive/documentation/General/Reference/InfoPlistKeyReference/Articles/CoreFoundationKeys.html
# In Windows, build-name is used as the major, minor, and patch parts
# of the product and file versions while build-number is used as the build suffix.
version: 1.0.0+1


environment:
  sdk: ^3.13.3

dependencies:
  flutter:
    sdk: flutter

  # State
  flutter_bloc: ^9.1.1

  # Networking
  dio: ^5.11.1
  pretty_dio_logger: ^1.4.0
  dartz: ^0.10.1
  http_parser: ^4.1.2

  # Realtime — Reverb speaks the Pusher protocol, and this client can point at
  # a self-hosted host. pusher_channels_flutter cannot: its native init()
  # accepts only a cluster.
  dart_pusher_channels: ^1.3.1

  # Storage
  shared_preferences: ^2.5.5
  path_provider: ^2.1.6

  # Localization
  easy_localization: ^3.0.8

  # Firebase and notifications
  firebase_messaging: ^16.6.0
  flutter_local_notifications: ^22.3.0

  # Device and files
  device_info_plus: ^13.2.0
  package_info_plus: ^10.2.1
  file_picker: ^12.3.0
  open_file: ^4.0.0
  mime: ^2.1.0
  url_launcher: ^6.3.2

  # Media and scanning
  camerawesome: ^2.5.0
  video_player: ^2.14.0
  simple_barcode_scanner: ^0.6.0

  # UI — form fields
  # v10: the OTP cubit owns a PinInputController rather than a
  # TextEditingController. See core/shared/widgets/custom_field_otp.dart.
  pin_code_fields: ^10.0.0
  flutter_intl_phone_field: ^0.1.1
  dropdown_search: ^7.0.0

  # UI — presentation
  flutter_svg: ^2.3.0
  dotted_border: ^3.1.0
  dynamic_height_grid_view: ^0.0.4
  upgrader: ^13.7.0
  smooth_page_indicator: ^3.0.0
  google_maps_flutter: ^2.18.0
  geolocator: ^14.0.3
  flutter_widget_from_html: ^0.17.4
  cached_network_image: ^4.0.0
  flutter_colorpicker: ^1.1.0
  moyasar: ^3.0.5
  firebase_core: ^4.14.0
  blue_thermal_printer: ^1.2.3
  flutter_blue_plus: ^2.3.12
  image: ^4.10.1
  permission_handler: ^12.0.3
  firebase_crashlytics: ^5.4.0
  curved_navigation_bar: ^1.0.6

dev_dependencies:
  flutter_test:
    sdk: flutter
  # Runs a test on a real device, with real layout, real hit-testing and a
  # real keyboard — the three things a widget test cannot simulate, and where
  # this project's last four defects have hidden.
  integration_test:
    sdk: flutter
  # Drives the integration_test above from the host, and is what receives
  # each `binding.takeScreenshot` call and writes it to disk. F19 Task 1.
  flutter_driver:
    sdk: flutter
  flutter_lints: ^6.0.0
  bloc_test: ^10.0.0
  mocktail: ^1.0.5
  plugin_platform_interface: ^2.1.8
  vector_graphics_compiler: ^1.3.0
  intl: ^0.20.3

flutter:
  uses-material-design: true

  assets:
    - assets/translations/
    - assets/images/
    - assets/icons/
    - assets/svg/
    # Shorebird reads its app id from the bundle at runtime; without this entry
    # a release builds, uploads, and silently never receives a patch.
    - shorebird.yaml

  fonts:
    - family: Tajawal
      fonts:
        - asset: assets/fonts/Tajawal/Tajawal-ExtraLight.ttf
          weight: 200
        - asset: assets/fonts/Tajawal/Tajawal-Light.ttf
          weight: 300
        - asset: assets/fonts/Tajawal/Tajawal-Regular.ttf
          weight: 400
        - asset: assets/fonts/Tajawal/Tajawal-Medium.ttf
          weight: 500
        - asset: assets/fonts/Tajawal/Tajawal-Bold.ttf
          weight: 700
        - asset: assets/fonts/Tajawal/Tajawal-ExtraBold.ttf
          weight: 800
        - asset: assets/fonts/Tajawal/Tajawal-Black.ttf
          weight: 900
